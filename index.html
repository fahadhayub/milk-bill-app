<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Milk Bill Calculator</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <header>
      <h1>Milk Bill Calculator</h1>
    </header>

    <div class="container">
      <div class="card">
        <div class="card-header" id="settingsHeader">
          <h2>⚙️ Settings &amp; Defaults</h2>
          <span id="settingsToggle">▼</span>
        </div>
        <div id="settingsContent" class="hidden">
          <div class="form-grid" style="margin-bottom: 1rem;">
            <div class="input-group"><label>Customer Name</label><input type="text" id="custName" value="Farook" /></div>
            <div class="input-group"><label>Address Info</label><input type="text" id="custAddress" value="1st Street" /></div>
            <div class="input-group"><label>Monthly Charge (₹)</label><input type="number" id="monthlyCharge" value="20" /></div>
          </div>

          <h3 style="font-size: 1rem; margin-bottom: 0.5rem;">Packet Prices (₹)</h3>
          <div class="form-grid" style="margin-bottom: 1rem;">
            <div class="input-group"><label>Green</label><input type="number" id="priceGreen" value="25" /></div>
            <div class="input-group"><label>Blue</label><input type="number" id="priceBlue" value="22" /></div>
            <div class="input-group"><label>Orange</label><input type="number" id="priceOrange" value="30" /></div>
            <div class="input-group"><label>Purple</label><input type="number" id="pricePurple" value="35" /></div>
          </div>

          <h3 style="font-size: 1rem; margin-bottom: 0.5rem;">Default Daily Order (Qty)</h3>
          <div class="form-grid" style="margin-bottom: 1rem;">
            <div class="input-group"><label>Green</label><input type="number" id="defGreen" value="3" /></div>
            <div class="input-group"><label>Blue</label><input type="number" id="defBlue" value="0" /></div>
            <div class="input-group"><label>Orange</label><input type="number" id="defOrange" value="0" /></div>
            <div class="input-group"><label>Purple</label><input type="number" id="defPurple" value="0" /></div>
          </div>
          <button class="btn btn-outline" id="saveSettingsBtn">Save Settings</button>
        </div>
      </div>

      <div class="card">
        <div class="calendar-controls">
          <select id="monthSelect"></select>
          <select id="yearSelect"></select>
        </div>
        <div style="font-size: 0.8rem; text-align: center; margin-bottom: 1rem; color: var(--text-light);">
          Tap once for 'No Milk'. Tap again for 'Custom Order'.
        </div>
        <div id="weekdayLabels" class="calendar-grid" style="margin-bottom: 0.5rem;"></div>
        <div id="calendar" class="calendar-grid"></div>
      </div>

      <button class="btn btn-primary" style="margin-bottom: 1rem;" id="generateBtn">Generate Bill</button>

      <div class="card" id="resultCard" style="display: none;">
        <h2>Generated Bill</h2>
        <pre id="billOutput"></pre>
        <button class="btn btn-outline" style="margin-top: 1rem;" id="copyBtn">📋 Copy Bill Text</button>
      </div>
    </div>

    <div class="modal-overlay" id="customModal">
      <div class="modal">
        <h2 style="margin-bottom: 1rem;">Custom Order for Day <span id="modalDay"></span></h2>
        <div class="form-grid" style="margin-bottom: 1.5rem;">
          <div class="input-group"><label>Green Qty</label><input type="number" id="modGreen" value="0" /></div>
          <div class="input-group"><label>Blue Qty</label><input type="number" id="modBlue" value="0" /></div>
          <div class="input-group"><label>Orange Qty</label><input type="number" id="modOrange" value="0" /></div>
          <div class="input-group"><label>Purple Qty</label><input type="number" id="modPurple" value="0" /></div>
        </div>
        <div style="display: flex; gap: 1rem;">
          <button class="btn btn-outline" id="cancelModalBtn">Cancel</button>
          <button class="btn btn-primary" id="saveCustomBtn">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
